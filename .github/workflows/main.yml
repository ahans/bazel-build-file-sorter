name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-26-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  # Installs the hook the way pre-commit users do (wheel bundling the binary of
  # the release pinned in setup.cfg) and runs it on a scratch repo.
  pre-commit:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-26-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pre-commit
      - run: pre-commit validate-manifest .pre-commit-hooks.yaml
      - name: Run hook on unsorted BUILD files
        run: |
          repo="$RUNNER_TEMP/hook-test"
          mkdir -p "$repo/pkg" "$repo/third_party"
          cp testdata/basic/input "$repo/BUILD"
          cp testdata/basic/input "$repo/pkg/BUILD.bazel"
          cp testdata/basic/input "$repo/third_party/foo.BUILD"
          cp testdata/basic/input "$repo/not_a_build_file"
          cd "$repo"
          git init -q
          git add -A

          # Exit code 1 means the hook modified files, which is what we want.
          status=0
          pre-commit try-repo "$GITHUB_WORKSPACE" bazel-build-file-sorter --all-files || status=$?
          if [[ $status -ne 1 ]]; then
              echo "expected pre-commit to exit 1 (files modified), got $status" >&2
              exit 1
          fi

          for f in BUILD pkg/BUILD.bazel third_party/foo.BUILD; do
              diff -u "$GITHUB_WORKSPACE/testdata/basic/expected" "$f"
          done
          diff -u "$GITHUB_WORKSPACE/testdata/basic/input" not_a_build_file

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
